<script>
  function setPlayIcon(button) {
    button.innerHTML = `
      <svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
      <span>listen</span>
    `;
  }

  function setPauseIcon(button) {
    button.innerHTML = `
      <svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      <span>listen</span>
    `;
  }

  window.nameOverrides = [
    {
      titleMatch: "live at dance practice: Selena Lee (mindful movmement)",
      name: "Selena Lee",
      image: "https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6802e9def491d1780de0548e_selena.jpg"
    },
    {
      titleMatch: "live at dance practice: Summer Minerva (group instruction)",
      name: "Summer Minerva",
      image: "https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/67c75df3390ef3c61ababafe_summer-3.png"
    },
    {
      artistMatch: "jalpari",
      name: "Jalpari",
      image: "https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/67ec69d4371997bacd845a9d_IMG_7125b.jpg"
    },
    {
      titleMatch: "luwan",
      name: "Luwan",
      image: "https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/67dc86933ff56ab3a9527991_IMG_4715.JPEG"
    },
    {
      artistMatch: "sobolik",
      name: "Sobolik",
      image: "https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/67b5f887d872e40c3114f835_artworks-ZZlVZlP6OfjvHOtu-yyytYQ-t1080x1080.jpeg"
    },
    {
      artistMatch: "concon",
      name: "concon",
      image: "https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/68030b16e9389ce12c452a4c_IMG_1392%202.jpeg"
    }
  ];

  window.allWidgets = window.allWidgets || [];
  window.scLoaded = window.scLoaded || false;

  function loadSoundCloudScriptOnce(callback) {
    if (window.SC) return callback();
    const sc = document.createElement("script");
    sc.src = "https://w.soundcloud.com/player/api.js";
    sc.onload = callback;
    document.head.appendChild(sc);
  }

  function initPlayer(playerId) {
    const widget = SC.Widget(document.getElementById(`sc-widget-${playerId}`));
    allWidgets.push(widget);

    const toggleBtn = document.getElementById(`toggleBtn-${playerId}`);
    const trackTitle = document.getElementById(`trackTitle-${playerId}`);
    const nextBtn = document.getElementById(`nextBtn-${playerId}`);
    const prevBtn = document.getElementById(`prevBtn-${playerId}`);
    const navButtons = document.getElementById(`navButtons-${playerId}`);
    const progressContainer = document.getElementById(`progressContainer-${playerId}`);
    const progressBar = document.getElementById(`progressBar-${playerId}`);
    const performerImage = document.getElementById(`performerImage-${playerId}`);

    let isPlaying = false;
    let hasPlayedOnce = false;

    function updateTrackInfo() {
      widget.getCurrentSound(sound => {
        let displayTitle = sound?.title || 'Untitled';
        const artistName = sound?.user?.username?.toLowerCase() || '';
        let imageSrc = '';

        for (const override of nameOverrides) {
          const matchesTitle = override.titleMatch && displayTitle.toLowerCase().includes(override.titleMatch.toLowerCase());
          const matchesArtist = override.artistMatch && artistName.includes(override.artistMatch.toLowerCase());
          if (matchesTitle || matchesArtist) {
            displayTitle = override.name;
            imageSrc = override.image;
            break;
          }
        }

        trackTitle.textContent = displayTitle;
        performerImage.src = imageSrc || (sound.artwork_url ? sound.artwork_url.replace('-large', '-t500x500') : '');
      });
    }

    function updateNavButtons() {
      widget.getCurrentSoundIndex(index => {
        widget.getSounds(sounds => {
          if (sounds.length > 1) {
            navButtons.style.display = 'flex';
            prevBtn.style.opacity = index > 0 ? '1' : '0.5';
            nextBtn.style.opacity = index < sounds.length - 1 ? '1' : '0.5';
          } else {
            navButtons.style.display = 'none';
          }
        });
      });
    }

    toggleBtn.addEventListener('click', () => {
      if (isPlaying) {
        widget.pause();
      } else {
        allWidgets.forEach(w => {
          if (w !== widget) w.pause();
        });
        widget.play();
      }
    });

    nextBtn.addEventListener('click', () => {
      widget.next();
      setTimeout(updateNavButtons, 500);
    });

    prevBtn.addEventListener('click', () => {
      widget.prev();
      setTimeout(updateNavButtons, 500);
    });

    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const percentage = x / rect.width;
      widget.getDuration(duration => {
        const newPos = duration * percentage;
        widget.seekTo(newPos);
      });
    });

    widget.bind(SC.Widget.Events.READY, () => {
      updateTrackInfo();
      updateNavButtons();
    });

    widget.bind(SC.Widget.Events.PLAY, () => {
      isPlaying = true;
      setPauseIcon(toggleBtn);
      updateTrackInfo();
      updateNavButtons();
      if (!hasPlayedOnce) {
        progressContainer.style.display = 'block';
        hasPlayedOnce = true;
      }
    });

    widget.bind(SC.Widget.Events.PAUSE, () => {
      isPlaying = false;
      setPlayIcon(toggleBtn);
    });

    widget.bind(SC.Widget.Events.FINISH, () => {
      isPlaying = false;
      setPlayIcon(toggleBtn);
      progressBar.style.width = '0%';
    });

    setInterval(() => {
      widget.getPosition(pos => {
        widget.getDuration(dur => {
          if (dur > 0) {
            const progress = (pos / dur) * 100;
            progressBar.style.width = `${progress}%`;
          }
        });
      });
    }, 500);
  }

  loadSoundCloudScriptOnce(() => {
    initPlayer("1");
    initPlayer("2");
    initPlayer("3");
  });
</script></head><body class="body"><div class="div-block-6"><img src="https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6a469723013b2d7fe4c975f8_bgee.jpg" loading="lazy" data-w-id="888c2f28-f7d3-d65d-cdf3-5c0e7d6b9ba6" sizes="(max-width: 1178px) 100vw, 1178px" alt="" srcset="https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6a469723013b2d7fe4c975f8_bgee-p-500.jpg 500w, https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6a469723013b2d7fe4c975f8_bgee-p-800.jpg 800w, https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6a469723013b2d7fe4c975f8_bgee.jpg 1178w" class="image-13"/><img src="https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6a469723013b2d7fe4c975f8_bgee.jpg" loading="lazy" sizes="(max-width: 1178px) 100vw, 1178px" srcset="https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6a469723013b2d7fe4c975f8_bgee-p-500.jpg 500w, https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6a469723013b2d7fe4c975f8_bgee-p-800.jpg 800w, https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6a469723013b2d7fe4c975f8_bgee.jpg 1178w" alt="" class="image-13"/></div><div class="section-dropshadow"><div class="carrer-headline-wrap"><section class="section-title"><img src="https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6802cda9cf754bd9d7a996c8_dp-title.png" loading="lazy" sizes="(max-width: 2058px) 100vw, 2058px" srcset="https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6802cda9cf754bd9d7a996c8_dp-title-p-500.png 500w, https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6802cda9cf754bd9d7a996c8_dp-title-p-800.png 800w, https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6802cda9cf754bd9d7a996c8_dp-title-p-1080.png 1080w, https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6802cda9cf754bd9d7a996c8_dp-title-p-1600.png 1600w, https://cdn.prod.website-files.com/65fa22bc8b4439cb4f235984/6802cda9cf754bd9d7a996c8_dp-title-p-2000.png 2000w, https://cdn.prod.website-files.com/65fa22b
